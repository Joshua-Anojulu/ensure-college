<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Forest Light social card: the editable source of app/static/og-image.png.
     Render at exactly 1200x630 in headless Chromium from the repo checkout
     (fonts load from app/static/fonts by relative path) and save the
     screenshot over app/static/og-image.png. Colors are the style.css
     Forest Light tokens; the mark is app/static/favicon.svg. -->
<style>
  @font-face { font-family: "Cabinet Grotesk"; src: url("../../app/static/fonts/CabinetGrotesk-Extrabold.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "Satoshi"; src: url("../../app/static/fonts/Satoshi-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "JetBrains Mono"; src: url("../../app/static/fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-weight: 400; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #1e4034; /* --brand */
    color: #fbfcfa; /* --brand-ink */
    font-family: "Satoshi", Arial, sans-serif;
  }
  .frame {
    position: absolute;
    inset: 52px 52px 52px;
    border: 1px solid rgba(251, 252, 250, 0.18);
  }
  .brand-row {
    position: absolute;
    top: 86px;
    left: 82px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .mark { display: block; width: 76px; height: 76px; }
  .mark svg { display: block; width: 100%; height: 100%; }
  /* The tile shares the card's green, so a hairline keeps its edge. */
  .mark rect { stroke: rgba(251, 252, 250, 0.28); stroke-width: 1.5; }
  .brand-name {
    font-family: "Cabinet Grotesk", Arial, sans-serif;
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  h1 {
    position: absolute;
    top: 222px;
    left: 82px;
    max-width: 980px;
    font-family: "Cabinet Grotesk", Arial, sans-serif;
    font-size: 84px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.015em;
  }
  .sub {
    position: absolute;
    top: 430px;
    left: 82px;
    font-size: 30px;
    font-weight: 500;
    color: rgba(251, 252, 250, 0.86);
  }
  .strip {
    position: absolute;
    left: 52px;
    right: 52px;
    bottom: 52px;
    display: flex;
    align-items: center;
    gap: 40px;
    height: 72px;
    padding: 0 30px;
    background: #fbfcfa; /* --surface */
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.08em;
  }
  .strip .site { color: #8a5e14; /* --accent-deep */ }
  .strip .what { color: #1e4034; /* --brand */ }
  .strip .dot { width: 10px; height: 10px; border-radius: 50%; background: #c98d2c; /* --accent */ }
</style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <div class="brand-row">
    <span class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="12" fill="#1e4034"/>
        <path d="M14 15h36v7H24v9h22v7H24v10h27v7H14z" fill="#fbfcfa"/>
        <circle cx="49" cy="16" r="5" fill="#c98d2c"/>
      </svg>
    </span>
    <span class="brand-name">EnsureCollege</span>
  </div>
  <h1>Your whole college plan,<br>in one place.</h1>
  <p class="sub">Scholarships, programs, competitions, and deadlines.</p>
  <div class="strip">
    <span class="site">ENSURECOLLEGE.COM</span>
    <span class="dot" aria-hidden="true"></span>
    <span class="what">MATCHES + APPLICATION PLAN</span>
  </div>
</body>
</html>
